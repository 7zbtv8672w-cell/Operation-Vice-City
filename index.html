<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#211226">
<meta name="description" content="Operation Vice City — GTA VI launch headquarters">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Operation Vice City</title>
<style>
:root{color-scheme:dark;--bg:#170f1d;--panel:#28172c;--panel2:#38203d;--pink:#ff83b5;--peach:#ffad78;--coral:#ff758d;--text:#fff2f0;--muted:#e5bcca;--line:#75445f;--good:#83e1ad;--warn:#ffd17d;--shadow:0 14px 38px #08050c88}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#542448 0,transparent 40%),radial-gradient(ellipse at 95% 20%,#593022 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}button{cursor:pointer}
header{padding:calc(18px + env(safe-area-inset-top)) 18px 14px;background:linear-gradient(135deg,#32172fdd,#211226ee);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--peach);font-weight:800}.logo{font-size:clamp(24px,6vw,35px);font-weight:950;line-height:.95;letter-spacing:-1.5px;color:var(--pink);text-shadow:0 0 24px #ff72ae55}.logo span{display:block;color:var(--peach)}.status{font-size:10px;border:1px solid #498967;color:var(--good);padding:6px 9px;border-radius:99px;white-space:nowrap}
.hero{margin:16px 0 0;padding:17px;border:1px solid #98506d;border-radius:18px;background:linear-gradient(120deg,#59233f,#743c39 58%,#3d2144);box-shadow:var(--shadow);overflow:hidden;position:relative}.hero:after{content:"🌴";position:absolute;right:12px;bottom:-15px;font-size:92px;opacity:.22}.hero small{color:#ffd1dc;letter-spacing:1.5px;font-weight:800}.hero h2{margin:4px 0 12px;font-size:21px}.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:440px}.timebox{background:#1d1027c9;border:1px solid #b65b7a66;border-radius:11px;padding:8px 3px;text-align:center}.timebox b{font-size:clamp(21px,5vw,29px);display:block;color:var(--peach);font-variant-numeric:tabular-nums}.timebox span{font-size:9px;color:#f3c5d2;letter-spacing:1px}
main{max-width:1050px;margin:auto;padding:15px 14px 100px}.nav{display:flex;gap:7px;overflow:auto;padding:3px 0 13px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{flex:0 0 auto;background:#332039;border:1px solid var(--line);color:#f4c6d4;border-radius:99px;padding:9px 13px;font-size:12px}.nav button.active{background:linear-gradient(100deg,#ef6f9f,#e99462);color:#2a1224;border-color:transparent;font-weight:850}
h1{font-size:23px;margin:5px 0 4px;color:var(--peach)}h2{font-size:18px;margin:0 0 10px;color:var(--pink)}h3{font-size:14px;margin:0 0 8px;color:var(--peach)}p{color:var(--muted);margin:5px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:linear-gradient(145deg,#301d35,#24162b);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 7px 22px #08050c33;margin:10px 0}.metric{font-size:29px;font-weight:900;color:var(--peach);font-variant-numeric:tabular-nums}.label{font-size:11px;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{font-size:12px;color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#523044;color:#ffd0d9;font-size:10px;font-weight:800}.pill.good{background:#183d32;color:var(--good)}.pill.warn{background:#4b3921;color:var(--warn)}
button.primary{border:0;border-radius:11px;padding:10px 14px;background:linear-gradient(110deg,#f277a5,#ffad73);color:#291323;font-weight:850}button.secondary{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#3b2540;color:var(--text)}button.danger{background:#713047;color:#fff;border:1px solid #a94c6a;border-radius:10px;padding:9px 12px}
input,textarea,select{width:100%;background:#1b1122;border:1px solid #75445f;border-radius:10px;padding:10px;color:var(--text);outline:none}textarea{min-height:100px;resize:vertical}label{font-size:12px;color:var(--muted);display:block;margin:10px 0 5px}input[type=range]{padding:0;accent-color:var(--pink)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.check{display:flex;gap:9px;align-items:flex-start;padding:7px 0;color:var(--muted);font-size:13px}.check input{width:auto;margin-top:3px;accent-color:var(--pink)}.progress{height:8px;border-radius:99px;background:#170f1d;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--peach));width:0}
footer{position:fixed;bottom:0;left:0;right:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#1c1123eF;border-top:1px solid var(--line);backdrop-filter:blur(15px);display:flex;justify-content:space-between;z-index:5;font-size:10px;color:var(--muted)}
.hidden{display:none!important}.biglaunch{background:linear-gradient(140deg,#572440,#9b4b42);padding:20px;border-radius:18px;text-align:center}.biglaunch strong{font-size:35px;display:block;color:#ffb178}.source{font-size:11px;color:#e8b9c8}
@media(min-width:720px){main{padding:22px 24px 90px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.hero{padding:22px}.nav{flex-wrap:wrap}.nav button{flex:0 0 auto}}
</style>
</head>
<body>
<header>
 <div class="brand"><div><div class="eyebrow">ROCKSTAR GAMES PRESENTS</div><div class="logo">OPERATION <span>VICE CITY</span></div><div class="eyebrow" style="margin-top:7px">ULTIMATE LAUNCH HEADQUARTERS · V8</div></div><div class="status">● LOCAL APP</div></div>
 <section class="hero"><small>COUNTDOWN TO VICE CITY</small><h2>19 NOVEMBER 2026 · 00:00 UK</h2><div class="countdown"><div class="timebox"><b id="days">--</b><span>DAYS</span></div><div class="timebox"><b id="hours">--</b><span>HOURS</span></div><div class="timebox"><b id="minutes">--</b><span>MINUTES</span></div><div class="timebox"><b id="seconds">--</b><span>SECONDS</span></div></div></section>
</header>
<main>
 <nav class="nav" id="nav"></nav>
 <section id="view"></section>
</main>
<footer><span>VICE CITY NEVER SLEEPS 🌴</span><span>V8 · YOUR PERSONAL LAUNCH HQ</span></footer>
<script>
const tabs=["Overview","Countdown","Intelligence","Exploration","Launch Control","Lighting","Xbox","Station","Schedule","Supplies","Budget","Map","Achievements","Statistics","Gallery","Notifications","Emergency","Crew"];
const icons=["⌂","◷","◉","⌖","▶","☼","▣","▤","▦","▧","£","⌑","★","▥","▣","♧","⚠","♙"];
const defaults={mode:"Preparation",crew:"Solo",session:false,readiness:75,scene:"Vice City Sunset",brightness:80,xbox:"Not tested",network:"Not tested",crashes:0,missions:0,locations:0,vehicles:0,collectibles:0,region:"Vice City",journal:"",intel:"",schedule:"22:00 — Final preparations\\n23:00 — Food and drinks ready\\n23:30 — Settle in\\n23:45 — Final console checks\\n00:00 — GRAND THEFT AUTO VI LAUNCH\\n00:15 — First exploration\\n01:00 — First session checkpoint",snacks:0,drinks:0,budget:500,spent:0,mapNotes:"",gallery:"",alerts:"No incidents reported.",notes:"",achievement:"First mission completed",reminders:"Controller charged\\nHeadset charged\\nConsole storage checked\\nInternet connection tested\\nSnacks and drinks stocked"};
let state={...defaults};try{state={...state,...JSON.parse(localStorage.getItem("viceCityV8")||"{}")}}catch(e){}
let current="Overview";
function save(){localStorage.setItem("viceCityV8",JSON.stringify(state))}
function set(k,v){state[k]=v;save();render()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function field(k,label,placeholder="",type="text"){return `<label>${label}</label><input type="${type}" data-key="${k}" value="${esc(state[k])}" placeholder="${placeholder}">`}
function area(k,label,placeholder=""){return `<label>${label}</label><textarea data-key="${k}" placeholder="${placeholder}">${esc(state[k])}</textarea>`}
function select(k,label,opts){return `<label>${label}</label><select data-key="${k}">${opts.map(x=>`<option ${state[k]===x?"selected":""}>${x}</option>`).join("")}</select>`}
function btn(label,action,cls="secondary"){return `<button class="${cls}" data-action="${action}">${label}</button>`}
function metric(n,l){return `<div class="card"><div class="metric">${n}</div><div class="label">${l}</div></div>`}
function counter(k,label){return `<div class="card"><div class="row"><b>${label}</b><strong class="metric">${state[k]}</strong></div><div class="actions">${btn("−","dec:"+k)}${btn("+ Add","inc:"+k,"primary")}</div></div>`}
function checklist(k){return `<div class="card"><h3>Preparation checklist</h3>${state[k].split("\\n").map((x,i)=>`<label class="check"><input type="checkbox"> ${esc(x)}</label>`).join("")}</div>`}
function render(){
 document.querySelector("#nav").innerHTML=tabs.map((t,i)=>`<button class="${t===current?"active":""}" data-tab="${t}">${icons[i]} ${t}</button>`).join("");
 const v=document.querySelector("#view");let s="";
 if(current==="Overview")s=`<h1>Command overview</h1><p>Your Vice City launch headquarters. Your entries save on this device.</p><div class="grid">${metric(state.locations,"Locations discovered")}${metric(state.missions,"Missions completed")}${metric(state.vehicles,"Vehicles collected")}${metric(state.collectibles,"Collectibles found")}</div><div class="card"><div class="row"><h3>Launch readiness</h3><b>${state.readiness}%</b></div><input type="range" min="0" max="100" step="5" data-key="readiness" value="${state.readiness}"><div class="progress"><i style="width:${state.readiness}%"></i></div></div><div class="card">${select("mode","Operational mode",["Standby","Preparation","Launch Ready","Live Operation"])}<div class="row"><b>Gaming session</b><span class="pill ${state.session?"good":"warn"}">${state.session?"ACTIVE":"STANDBY"}</span></div><div class="actions">${btn(state.session?"End session":"Start session","session","primary")}</div></div><div class="grid">${tabs.slice(2,5).map(t=>`<div class="card"><h3>${t}</h3><button class="secondary" data-tab="${t}">Open department →</button></div>`).join("")}</div>`;
 if(current==="Countdown")s=`<h1>Countdown centre</h1><div class="biglaunch"><small>THE WAIT IS ALMOST OVER</small><strong>19.11.26 · 00:00</strong><p>Grand Theft Auto VI · UK launch</p><div class="source">Countdown updates every second while this app is open.</div></div><div class="card"><h3>Launch milestones</h3><p>7 days — final preparations<br>48 hours — console and storage checks<br>24 hours — stock up and charge devices<br>60 minutes — get settled<br>15 minutes — final checks<br>00:00 — launch</p></div>`;
 if(current==="Intelligence")s=`<h1>Vice City Intelligence</h1><p>Keep verified facts separate from reporting and speculation.</p><div class="card"><span class="pill good">OFFICIAL SOURCE</span><h3>Rockstar Games · GTA VI</h3><p>Check official announcements, trailers and release information here.</p><a href="https://www.rockstargames.com/VI" target="_blank" rel="noopener" style="color:var(--peach)">Open Rockstar GTA VI ↗</a></div><div class="card"><h3>Classification guide</h3><p><b>Confirmed:</b> official Rockstar / authoritative source.<br><b>Reported:</b> attributed reporting, not independently confirmed.<br><b>Rumour:</b> community speculation.</p>${area("intel","Intelligence log","Headline, date, source, classification and notes...")}${btn("Copy intelligence log","copy:intel","primary")}</div>`;
 if(current==="Exploration")s=`<h1>Exploration tracker</h1><p>Build your own record of the world as you discover it.</p><div class="card">${select("region","Current region",["Vice City","Leonida Keys","Grassrivers","Port Gellhorn","Mount Kalaga","Other / unknown"])}</div><div class="grid">${counter("locations","Locations discovered")}${counter("missions","Missions completed")}${counter("vehicles","Vehicles collected")}${counter("collectibles","Collectibles found")}</div><div class="card">${area("journal","Discovery journal","What did you find? Where? Any interesting details?")}${btn("Copy journal entry","copy:journal","primary")}</div>`;
 if(current==="Launch Control")s=`<h1>Live launch control</h1><div class="biglaunch"><small>OPERATION MIDNIGHT</small><strong>VICE CITY GO LIVE</strong><p>THURSDAY · 19 NOVEMBER 2026 · 00:00</p></div><div class="card">${select("crew","Launch crew",["Solo","Duo"])}${area("schedule","Launch-night running order","")}</div><div class="card"><span class="pill ${state.session?"good":"warn"}">${state.session?"SESSION ACTIVE":"STANDBY"}</span><div class="actions">${btn("INITIATE LAUNCH","launch","primary")}${btn("End session","stop","danger")}</div><p class="source">These controls update the app only; they do not start your Xbox or game.</p></div>`;
 if(current==="Lighting")s=`<h1>Lighting control</h1><span class="pill warn">WiZ NOT CONNECTED</span><div class="card">${select("scene","Choose scene",["Vice City Sunset","Neon Nights","Ocean Drive","Golden Hour","Midnight"])}<label>Brightness: ${state.brightness}%</label><input type="range" min="1" max="100" data-key="brightness" value="${state.brightness}"><p class="source">Scene and brightness are saved preferences only until a real integration is configured.</p><a href="https://www.home-assistant.io/integrations/wiz/" target="_blank" rel="noopener" style="color:var(--peach)">WiZ Home Assistant setup guide ↗</a></div>`;
 if(current==="Xbox")s=`<h1>Xbox reliability centre</h1><span class="pill warn">DIRECT CONNECTION PENDING</span><div class="card">${select("xbox","Console health",["Not tested","Testing","Stable","Issue detected"])}${select("network","Network health",["Not tested","Testing","Stable","Issue detected"])}</div><div class="card"><div class="row"><b>Crash incident counter</b><strong class="metric">${state.crashes}</strong></div><div class="actions">${btn("−","dec:crashes")}${btn("Record crash","inc:crashes","primary")}</div></div><a href="https://support.xbox.com/en-GB/" target="_blank" rel="noopener" style="color:var(--peach)">Xbox support ↗</a>`;
 if(current==="Station")s=`<h1>Gaming station</h1><div class="card"><h3>Your hardware</h3><p>Xbox Series X<br>27-inch monitor<br>WiZ multicolour ceiling light<br>Headset and controller charging<br>Mini fridge<br>Gaming chair</p></div>${checklist("reminders")}`;
 if(current==="Schedule")s=`<h1>Operations schedule</h1><div class="card">${area("schedule","Editable launch-night schedule")}${btn("Copy schedule","copy:schedule","primary")}</div>`;
 if(current==="Supplies")s=`<h1>Supply depot</h1><div class="grid">${counter("snacks","Snacks stocked")}${counter("drinks","Drinks stocked")}</div><div class="card"><h3>Shopping essentials</h3><p>Main meals / takeaway<br>Snacks and sweets<br>Soft drinks and water<br>Breakfast for the morning after<br>Paper towels and bin bags<br>Charging cables and batteries</p></div>`;
 if(current==="Budget")s=`<h1>Budget control</h1><div class="card"><div class="metric">£${state.budget}</div><p>Planned budget · £${state.spent} spent · £${state.budget-state.spent} remaining</p>${field("budget","Budget (£)","500","number")}${field("spent","Spending (£)","0","number")}</div>`;
 if(current==="Map")s=`<h1>Vice City map room</h1><div class="card"><h3>Explore by region</h3>${select("region","Region",["Vice City","Leonida Keys","Grassrivers","Port Gellhorn","Mount Kalaga","Other"])}${area("mapNotes","Map notes","Record places of interest and discoveries...")}<p class="source">This is a notes-based map room, not a live in-game map.</p></div>`;
 if(current==="Achievements")s=`<h1>Achievement room</h1><div class="card">${select("achievement","Personal milestone",["First mission completed","First vehicle collected","First location discovered","First hidden collectible","First full session","First region explored"])}<p class="source">Personal tracker, not connected to Xbox achievements.</p></div>`;
 if(current==="Statistics")s=`<h1>Statistics & records</h1><div class="grid">${metric(state.missions,"Missions")}${metric(state.locations,"Locations")}${metric(state.vehicles,"Vehicles")}${metric(state.collectibles,"Collectibles")}</div><div class="card"><h3>Progress total</h3><div class="metric">${state.missions+state.locations+state.vehicles+state.collectibles}</div>${btn("Export statistics","export","primary")}</div>`;
 if(current==="Gallery")s=`<h1>Screenshot gallery</h1><div class="card">${area("gallery","Gallery notes","Add screenshot descriptions, filenames or memorable moments...")}${btn("Copy gallery notes","copy:gallery","primary")}<p class="source">Notes gallery; it does not automatically import Xbox screenshots.</p></div>`;
 if(current==="Notifications")s=`<h1>Notification centre</h1><span class="pill warn">EXTERNAL NOTIFICATIONS NOT CONNECTED</span><div class="card"><p>• Countdown runs while app is open.<br>• WiZ integration pending.<br>• Xbox integration pending.<br>• Console reliability checks required.</p>${area("alerts","Notification and incident notes","Record an update...")}${btn("Copy notices","copy:alerts","primary")}</div>`;
 if(current==="Emergency")s=`<h1>Emergency procedures</h1><div class="card"><span class="pill warn">CONSOLE FAILURE</span><h3>If Xbox crashes</h3><p>1. Record the time and game.<br>2. Check whether the console restarted or only the game closed.<br>3. Note any error code.<br>4. Check ventilation and storage.<br>5. Avoid repeated forced restarts.</p></div><div class="card"><h3>If internet fails</h3><p>Check router status, Xbox network status and record the outage. Avoid changing multiple settings at once.</p>${area("notes","Incident notes","Record what happened...")}</div>`;
 if(current==="Crew")s=`<h1>Crew management</h1><div class="card">${select("crew","Crew configuration",["Solo","Duo"])}${area("crewNotes","Crew briefing","Names, roles, plans and food preferences...")}</div>`;
 v.innerHTML=s;
}
function countdown(){let ms=Math.max(0,new Date("2026-11-19T00:00:00+00:00").getTime()-Date.now());let vals=[Math.floor(ms/86400000),Math.floor(ms%86400000/3600000),Math.floor(ms%3600000/60000),Math.floor(ms%60000/1000)];["days","hours","minutes","seconds"].forEach((id,i)=>document.getElementById(id).textContent=String(vals[i]).padStart(2,"0"))}
document.addEventListener("click",e=>{let t=e.target.closest("[data-tab]");if(t){current=t.dataset.tab;render();return}let b=e.target.closest("[data-action]");if(!b)return;let a=b.dataset.action;if(a==="session"){state.session=!state.session;if(state.session)state.mode="Live Operation"}else if(a==="launch"){state.session=true;state.mode="Live Operation"}else if(a==="stop"){state.session=false;state.mode="Standby"}else if(a.startsWith("inc:"))state[a.slice(4)]++;else if(a.startsWith("dec:"))state[a.slice(4)]=Math.max(0,state[a.slice(4)]-1);else if(a.startsWith("copy:")){let k=a.slice(5);navigator.clipboard?.writeText(state[k]||"");b.textContent="Copied"}else if(a==="export"){navigator.clipboard?.writeText(JSON.stringify(state,null,2));b.textContent="Exported"}save();render()});
document.addEventListener("input",e=>{let k=e.target.dataset.key;if(!k)return;let v=e.target.type==="number"||e.target.type==="range"?Number(e.target.value):e.target.value;state[k]=v;save();if(k==="readiness"||k==="brightness")render()});
document.addEventListener("change",e=>{let k=e.target.dataset.key;if(!k)return;state[k]=e.target.type==="number"?Number(e.target.value):e.target.value;save();render()});
render();countdown();setInterval(countdown,1000);
if("serviceWorker" in navigator && location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body>
</html>
